# Odin1 Lite 点云 → /scan；与gazebo/lidar.xacro保持10 Hz、0.15–25 m一致。
# 官方第12章：120°×90°、约0.5°、名义深度240×180；第5章原始点云256×192。
# 转换器不要求固定点云行列数，只需要有效xyz和TF。
# 25m对应10%反射率且光照<50klux；50m要求90%反射率且光照<500lux。
# 高度和角度均在target_frame内计算，不是雷达安装标定。
# base_link高度带保留0.10–0.60m；实体安装后需要重新确认。
# ±60°在云台相对底盘旋转时会裁剪点云；需要环视导航时应单独扩大扫描角域。
pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_link
    transform_tolerance: 0.05
    min_height: 0.10              # target_frame内的高度，需按安装验证
    max_height: 0.60
    angle_min: -1.0471975512      # -60°
    angle_max: 1.0471975512       # +60°
    angle_increment: 0.0087266463 # 0.5°输出角度分箱
    scan_time: 0.1                # Lite最高10 FPS
    range_min: 0.15
    range_max: 25.0
    use_inf: true                 # 没打到的方向填 inf，costmap 才能区分“空旷”和“没数据”
    inf_epsilon: 1.0
